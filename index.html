<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Erin Apu!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* ব্যাকগ্রাউন্ড ম্যাজিক */
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: 1;
        }

        /* ৩ডি কার্ড কন্টেইনার */
        .card-container {
            width: 350px;
            height: 500px;
            perspective: 1000px;
            z-index: 10;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%; height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* কার্ডের সামনের দিক */
        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(255, 0, 150, 0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #1a1a1a, #000);
        }

        .card-front h1 {
            font-size: 80px;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px #ff007f;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
        }

        .card-front .name-glow {
            font-family: 'Pacifico', cursive;
            font-size: 60px;
            color: #fff;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f;
            margin-top: -20px;
        }

        .click-hint {
            margin-top: 50px;
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        /* কার্ডের পেছনের দিক */
        .card-back {
            background: #fff;
            color: #000;
            transform: rotateY(180deg);
            padding: 30px;
        }

        .card-back h2 {
            font-family: 'Pacifico', cursive;
            font-size: 35px;
            color: #ff007f;
            margin-bottom: 20px;
        }

        .card-back p {
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
        }

        .card-back .footer {
            margin-top: 30px;
            font-weight: bold;
            color: #ff007f;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* আতশবাজি পার্টিকেলস */
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background: #ff007f;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="card-container" onclick="this.classList.toggle('flipped'); createConfetti();">
        <div class="card-inner">
            <div class="card-front">
                <h1>19</h1>
                <div class="name-glow">Erin</div>
                <div class="click-hint">Click to Open</div>
            </div>

            <div class="card-back">
                <h2>Happy Birthday!</h2>
                <p>
                    শুভ জন্মদিন <b>এরিন আপু</b>! আজকের দিনটা আপনার জন্য অনেক অনেক স্পেশাল। সারাদিন খুব হাসিখুশি থাকুন আর দিনটা প্রাণভরে এনজয় করুন। ১৯তম জন্মদিনের অনেক অনেক ভালোবাসা!
                </p>
                <div class="footer">Have a blast! 🥳</div>
            </div>
        </div>
    </div>

    <script>
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = Math.random() * window.innerHeight + 'px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);

                confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 3000 + 2000,
                    easing: 'ease-out'
                });

                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>
</body>
</html>

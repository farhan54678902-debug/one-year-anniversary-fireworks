<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 19th Birthday, Erin Apu!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: white;
            perspective: 1000px;
        }

        /* ব্যাকগ্রাউন্ড ম্যাজিক্যাল গোল্ডেন ডাস্ট */
        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            filter: blur(1px);
        }

        /* মেইন প্রিমিয়াম কার্ড */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 100px rgba(255, 215, 0, 0.1);
            animation: cardAppear 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto; /* যাতে কনফেটি বাটনে ক্লিক করা যায় */
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 215, 0, 0.4);
        }

        /* নাম সেকশন - রয়্যাল গোল্ডেন লুকে */
        .name-section { margin-bottom: 25px; }

        .name-en {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(80px, 15vw, 120px);
            background: linear-gradient(180deg, #fff, #ffd700, #ff8c00, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            display: block;
            margin: 0;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .apu-title {
            font-size: 20px;
            color: #ffd700;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: -15px;
            display: block;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .age-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        /* ইমোশনাল মেসেজ BOX */
        .wish-box {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            line-height: 1.8;
            font-style: italic;
            color: #eee;
            margin: 30px 0;
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s;
        }

        .signature {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffd700;
            margin-top: 50px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            padding-top: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards 3s;
        }

        .btn-magic {
            background: none;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            pointer-events: auto;
            margin-top: 20px;
        }

        .btn-magic:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 30px #ffd700;
        }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.8) translateY(50px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* মোবাইল স্ক্রিনের জন্য অ্যাডজাস্টমেন্ট */
        @media (max-width: 600px) {
            .name-en { font-size: 70px; }
            .card { padding: 40px 20px; }
            .wish-box { font-size: 18px; line-height: 1.6; }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="name-section">
            <h1 class="name-en">Erin</h1>
            <span class="apu-title">Apu</span>
        </div>
        
        <span class="age-badge">Happy 19th Birthday</span>

        <div class="wish-box">
            "প্রিয় এরিন আপু, ১৯ বছরে পদার্পণ করায় তোমাকে অনেক অনেক অভিনন্দন! তুমি শুধু আমাদের বাড়ির বড় আপুই নও, তুমি আমার অন্যতম সেরা মেন্টর এবং বন্ধু। তুমি সবসময় এভাবেই হাসিখুশি আর প্রাণবন্ত থাকো—এটাই আমাদের চাওয়া। আজকের দিনটা খুব উপভোগ করো!"
        </div>

        <button class="btn-magic" onclick="megaCelebration()">Magic Show 🎇</button>

        <div class="signature">With love from your small brother</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let hearts = [];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // মাউস ফলো ইফেক্ট (আলোর কণা ও হার্ট)
        window.addEventListener('mousemove', (e) => {
            if (Math.random() < 0.1) {
                hearts.push(new Heart(e.clientX, e.clientY));
            }
            if (Math.random() < 0.2) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 3;
                this.speedY = (Math.random() - 0.5) * 3;
                this.alpha = 1;
                this.color = `hsl(${Math.random() * 20 + 40}, 100%, 50%)`; // গোল্ডেন সেড
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.01;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Heart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 5;
                this.speedY = -Math.random() * 2 - 1;
                this.alpha = 1;
            }
            update() {
                this.y += this.speedY;
                this.alpha -= 0.012;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ff3366'; // মিষ্টি লাল/পিঙ্ক
                ctx.font = `${this.size}px serif`;
                ctx.fillText('❤', this.x, this.y);
            }
        }

        function createFirework(x, y) {
            const colors = ['#ffd700', '#ffffff', '#ff3366', '#00d4ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 / 50) * i;
                const speed = Math.random() * 5 + 3;
                particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        function megaCelebration() {
            for(let i=0; i<10; i++) {
                setTimeout(() => {
                    createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.7);
                }, i * 300);
            }
        }

        function animate() {
            // ব্যাকগ্রাউন্ড ট্রেইল ইফেক্ট
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                if (p.alpha > 0) {
                    p.update();
                    p.draw();
                } else {
                    particles.splice(i, 1);
                }
            });

            hearts.forEach((h, i) => {
                if (h.alpha > 0) {
                    h.update();
                    h.draw();
                } else {
                    hearts.splice(i, 1);
                }
            });

            // অটো হালকা ডাস্ট ইফেক্ট
            if (Math.random() < 0.05) {
                particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height, 0, -1));
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

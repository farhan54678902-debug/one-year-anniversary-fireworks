<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1st Anniversary! ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffeef2;
            font-family: 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            border: 4px dashed #ff85a2;
            max-width: 400px;
            z-index: 10;
        }

        /* Cartoon Styles */
        .cartoon-couple {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            color: #ff477e;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
            font-size: 18px;
        }

        .days-counter {
            background: #ffecf1;
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
            color: #ff477e;
            margin: 20px 0;
            display: inline-block;
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: #ff85a2;
            font-size: 20px;
            user-select: none;
            animation: floatUp 4s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        button {
            background: #ff477e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
        }

        button:hover {
            background: #ff85a2;
            transform: scale(1.1);
        }

        /* Hidden Message */
        #secret-msg {
            display: none;
            margin-top: 20px;
            font-style: italic;
            color: #ff477e;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="container">
        <div class="cartoon-couple">👩‍❤️‍👨</div>
        
        <h1>Happy 1 Year! ❤️</h1>
        
        <p>আমাদের একসাথে চলার ৩৬৫ দিন পূর্ণ হলো। তুমি আমার জীবনের সবচেয়ে সুন্দর উপহার।</p>
        
        <div class="days-counter">
            ✨ ১ বছর

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ethika - Ramadan Mubarak</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;600&display=swap');

        body {
            background-color: #FFF0F5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Hind Siliguri', sans-serif;
            overflow: hidden;
        }

        /* Card Style */
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            z-index: 10;
            border: 2px solid #FFB7C5;
        }

        h1 { color: #FF69B4; font-size: 24px; }
        p { color: #555; line-height: 1.6; font-size: 18px; }

        /* Mochi Cat CSS (Peach) */
        .cat {
            width: 80px;
            height: 60px;
            background: #fff;
            border-radius: 40px 40px 30px 30px;
            position: absolute;
            animation: float 3s infinite ease-in-out;
            border: 2px solid #eee;
        }

        .cat.goma { background: #E0E0E0; } /* Goma is slightly grey */

        /* Ears */
        .cat::before, .cat::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 20px;
            height: 20px;
            background: inherit;
            border-radius: 50% 50% 0 0;
        }
        .cat::before { left: 10px; }
        .cat::after { right: 10px; }

        /* Eyes & Blush */
        .eyes {
            position: absolute;
            top: 25px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .eye { width: 6px; height: 6px; background: #333; border-radius: 50%; }
        .blush {
            position: absolute;
            top: 35px;
            width: 10px;
            height: 5px;
            background: #FFB7C5;
            border-radius: 50%;
        }

        /* Positioning Cats */
        #peach { top: 15%; left: 15%; }
        #goma { top: 15%; right: 15%; animation-delay: 1.5s; }
        
        .baby { transform: scale(0.6); }
        #baby1 { bottom: 15%; left: 10%; animation-delay: 0.5s; }
        #baby2 { bottom: 20%; right: 15%; animation-delay: 1s; }
        #baby3 { bottom: 10%; right: 40%; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .ramadan-wish {
            margin-top: 20px;
            font-weight: bold;
            color: #FF1493;
        }
    </style>
</head>
<body>

    <div id="peach" class="cat">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="blush" style="left:10px"></div><div class="blush" style="right:10px"></div>
    </div>

    <div id="goma" class="cat goma">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="blush" style="left:10px"></div><div class="blush" style="right:10px"></div>
    </div>

    <div id="baby1" class="cat baby">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    </div>
    <div id="baby2" class="cat baby goma">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    </div>
    <div id="baby3" class="cat baby">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    </div>

    <div class="card">
        <h1>প্রিয় ইথিকা ❤️</h1>
        <p>দেখতে দেখতে এক বছর হয়ে গেল। এটা আমাদের দ্বিতীয় রমজান, কিন্তু এখন তুমি আমার থেকে অনেক দূরে।</p>
        <p>যাই হোক, দূরত্ব যাই হোক না কেন, তুমি সবসময় আমার পাশেই আছো।</p>
        <p class="ramadan-wish">রমজান মোবারক! 🌙</p>
        <p style="font-size: 14px; color: #888;">— তোমার ফারহান</p>
    </div>

</body>
</html>

        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 19th Birthday Erin Apu!</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #1a0a2e 0%, #050505 100%);
            font-family: 'Poppins', sans-serif;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        /* আপুর জন্য রয়েল গোল্ডেন এবং পিঙ্ক মিক্সড লুক */
        .name-title {
            font-family: 'Dancing Script', cursive;
            font-size: 110px;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 154, 158, 0.8));
            margin: 0;
            animation: float 3s ease-in-out infinite;
        }

        .sub-text {
            font-size: 24px;
            color: #ffd700; /* গোল্ডেন কালার ফর আপু */
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: -10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .wish-box {
            background: rgba(255, 255, 255, 0.07);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            max-width: 550px;
            margin-top: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: translateY(20px);
            animation: fadeIn 2s forwards;
        }

        .wish-box p {
            color: #ffffff;
            line-height: 1.8;
            font-size: 19px;
            margin-bottom: 15px;
        }

        .signature {
            font-family: 'Pacifico', cursive;
            font-size: 16px;
            color: #ffd700;
        }

        .celebrate-btn {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 25px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .celebrate-btn:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 0 30px #ffd700;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .name-title { font-size: 65px; }
            .wish-box { width: 85%; padding: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <h1 class="name-title">Erin Apu</h1>
        <div class="sub-text">Happy 19th Birthday! 🌟</div>

        <div class="wish-box">
            <p>
                প্রিয় <strong>এরিন আপু</strong>,<br>
                দেখতে দেখতে ১৯-এ পা দিলে! তুমি শুধু আমার বড় আপু নও, তুমি আমার সেরা বন্ধু এবং সবসময় আগলে রাখা অভিভাবক। তোমার এই বিশেষ দিনটি তোমার মতোই সুন্দর আর উজ্জ্বল হোক। 
            </p>
            <p>আমাদের খুনসুটি আর ভালোবাসা যেন সারাজীবন এমন অটুট থাকে। শুভ জন্মদিন!</p>
            <div class="signature">~ তোমার ছোট ভাই</div>
            
            <button class="celebrate-btn" onclick="megaFirework()">ম্যাজিক দেখো! ✨</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.friction = 0.96;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.012;
            }
        }

        function createFirework(x, y) {
            const count = 100;
            const angleIncrement = (Math.PI * 2) / count;
            for (let i = 0; i < count; i++) {
                const velocity = {
                    x: Math.cos(angleIncrement * i) * (Math.random() * 6),
                    y: Math.sin(angleIncrement * i) * (Math.random() * 6)
                };
                particles.push(new Particle(x, y, `hsl(${Math.random() * 360}, 70%, 60%)`, velocity));
            }
        }

        function megaFirework() {
            for(let i=0; i<5; i++) {
                setTimeout(() => {
                    createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.7);
                }, i * 200);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                if (p.alpha > 0) {
                    p.update();
                    p.draw();
                } else {
                    particles.splice(i, 1);
                }
            });
            if (Math.random() < 0.04) createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.8);
        }

        animate();
    </script>
</body>
  </html>

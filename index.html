 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramadan Mubarak, Ethika!</title>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Handlee', cursive;
            background-color: #ffe0b2; /* Light peach background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 600px;
            z-index: 10;
            position: relative;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #ff7043; /* Orange-red */
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            color: #6d4c41; /* Brownish */
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .signature {
            margin-top: 30px;
            font-size: 1.3em;
            color: #ff7043;
            font-weight: bold;
        }

        .mochi-cat {
            position: absolute;
            width: 100px; /* Adjust size as needed */
            height: auto;
            animation: floatAndRotate 10s infinite ease-in-out;
            z-index: 5;
        }

        .mochi-cat.peach {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .mochi-cat.goma {
            bottom: 15%;
            right: 8%;
            animation-delay: 2s;
        }

        .mochi-cat.baby1 {
            top: 30%;
            left: 15%;
            width: 70px;
            animation-delay: 1s;
        }

        .mochi-cat.baby2 {
            bottom: 25%;
            left: 10%;
            width: 60px;
            animation-delay: 3s;
        }

        .mochi-cat.baby3 {
            top: 20%;
            right: 12%;
            width: 65px;
            animation-delay: 4s;
        }

        @keyframes floatAndRotate {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(20px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>প্রিয় ইথিকা,</h1>
        <p>
            দেখতে দেখতে এক বছর হয়ে গেল... এটা আমাদের দ্বিতীয় রমজান। 
            অথচ, এখন তুমি আমার থেকে অনেক দূরে। 
            তবে দূরত্ব কোনো ব্যাপার না, আমাদের ভালোবাসা সবসময় এক।
        </p>
        <p>
            আশা করি তোমার রমজান মাস আনন্দময় হোক। অনেক ভালো থেকো।
        </p>
        <p class="signature">
            রমজান মোবারক! <br>
            ইতি, ফারহান
        </p>
    </div>

    <img src="https://i.ibb.co/3s3672K/peach-mochi-cat.png" alt="Peach Mochi Cat" class="mochi-cat peach">
    <img src="https://i.ibb.co/L9b4PjS/goma-mochi-cat.png" alt="Goma Mochi Cat" class="mochi-cat goma">
    <img src="https://i.ibb.co/K2J2gC3/baby-mochi-cat.png" alt="Baby Mochi Cat 1" class="mochi-cat baby1">
    <img src="https://i.ibb.co/K2J2gC3/baby-mochi-cat.png" alt="Baby Mochi Cat 2" class="mochi-cat baby2">
    <img src="https://i.ibb.co/K2J2gC3/baby-mochi-cat.png" alt="Baby Mochi Cat 3" class="mochi-cat baby3">
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Happy 19th Birthday Erin!</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #0f0c29; /* ডার্ক থিম যাতে ফায়ারওয়ার্কস ভালো লাগে */
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #card-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      border: 2px solid #ff007f;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
      z-index: 10;
      max-width: 600px;
    }

    /* বড় করে নাম */
    .name-title {
      font-family: 'Pacifico', cursive;
      font-size: 80px;
      color: #ff007f;
      margin: 0;
      text-shadow: 3px 3px #fff, 6px 6px #ff007f;
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    .age-text {
      font-size: 30px;
      font-weight: bold;
      color: #00d4ff;
      margin-top: -10px;
      display: block;
    }

    .message {
      font-size: 18px;
      line-height: 1.6;
      margin: 20px 0;
    }

    #celebrate-btn {
      background: linear-gradient(45deg, #ff007f, #00d4ff);
      padding: 15px 30px;
      border-radius: 50px;
      cursor: pointer;
      display: inline-block;
      font-weight: bold;
      transition: transform 0.3s;
      border: none;
      color: white;
      text-decoration: none;
    }

    #celebrate-btn:hover {
      transform: scale(1.1);
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff007f; }
      to { text-shadow: 0 0 30px #ff007f, 0 0 10px #00d4ff; }
    }

    /* ফায়ারওয়ার্কস ক্যানভাস */
    #fireworks-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="fireworks-canvas"></div>

  <div id="card-container">
    <div id="text-canvas">
      <h1 class="name-title">Erin</h1>
      <span class="age-text">It's your 19th Birthday!</span>
      
      <div class="message">
        <p>১৯ বছরে পদার্পণ করায় অনেক অনেক অভিনন্দন! দিনটি তোমার জন্য আনন্দ, হাসি আর দারুণ সব স্মৃতিতে ভরে উঠুক। সামনের দিনগুলো হোক আরও উজ্জ্বল এবং বর্ণিল।</p>
      </div>

      <div id="celebrate-btn">
         <span>Let's Celebrate! 🎇</span>
      </div>
    </div>
  </div>

  <script src="libs/jquery-1.10.1.min.js"></script>
  <script src="libs/underscore-min.js"></script>
  <script src="js/app.js"></script>

</body>
</html>

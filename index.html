<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জুবায়ের এর পক্ষ থেকে রাবেয়ার জন্য ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@300;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ffb3c1;
            --dark: #590d22;
            --soft: #fff0f3;
            --gold: #ffd700;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--soft);
            font-family: 'Hind Siliguri', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Music Floating Button */
        .music-note {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }

        .names-header {
            position: fixed;
            top: 0;
            width: 100%;
            text-align: center;
            font-family: 'Pacifico', cursive;
            font-size: 22px;
            color: var(--primary);
            z-index: 1000;
            background: rgba(255, 240, 243, 0.95);
            padding: 12px 0;
            border-bottom: 2px solid var(--secondary);
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px;
            position: relative;
        }

        .card {
            background: white;
            padding: 50px 30px;
            border-radius: 50px;
            box-shadow: 0 25px 70px rgba(255, 77, 109, 0.2);
            max-width: 700px;
            width: 95%;
            text-align: center;
            border: 1px solid var(--secondary);
            opacity: 0;
            transform: scale(0.8);
            transition: 1.2s all cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.active { opacity: 1; transform: scale(1); }

        /* Gift Box Styles */
        .gift-container {
            cursor: pointer;
            margin: 30px 0;
            transition: 0.3s;
            position: relative;
        }

        .gift-box {
            font-size: 100px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            animation: wobble 2s infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg) scale(1.1); }
        }

        .gift-content {
            display: none;
            background: var(--soft);
            padding: 20px;
            border-radius: 20px;
            margin-top: 15px;
            border: 2px dashed var(--primary);
            animation: fadeIn 1s;
        }

        /* Typing Effect */
        .typing {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--dark);
            border-right: 3px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3s steps(30), blink 0.5s infinite step-end alternate;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from { border-color: transparent } to { border-color: var(--primary) } }

        .cartoon { font-size: 80px; display: block; margin-bottom: 10px; }

        .sorry-box {
            background: #fff5f5;
            border: 3px solid var(--primary);
        }

        .btn-final {
            background: linear-gradient(45deg, var(--primary), var(--dark));
            color: white;
            padding: 20px 60px;
            border-radius: 50px;
            border: none;
            font-size: 1.5rem;
            font-family: 'Pacifico', cursive;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.5);
        }

        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: fly 4s linear infinite;
        }

        @keyframes fly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="names-header">Jubayer ❤️ Rabeya | ১ম বর্ষপূর্তি</div>

    <div class="music-note">🎵</div>

    <section style="background: linear-gradient(to bottom, #fff0f3, #ffffff);">
        <div class="card reveal">
            <span class="cartoon">🤴👸</span>
            <h1 class="typing">Happy Anniversary, Rabeya!</h1>
            <p style="font-size: 1.4rem;">জুবায়ের এর পক্ষ থেকে ছোট্ট এক ভালোবাসার উপহার।</p>
            <p>নিচের দিকে যাও, তোমার জন্য অনেক সারপ্রাইজ অপেক্ষা করছে...</p>
        </div>
    </section>

    <section>
        <div class="card reveal sorry-box">
            <h2>🎁 প্রথম উপহার: ক্ষমা ও ভালোবাসা</h2>
            <p>রা

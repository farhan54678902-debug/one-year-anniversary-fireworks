<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Erin Apu!</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Bungee+Shade&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #1a0033 0%, #000 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            pointer-events: none;
        }

        /* এরিন আপুর নাম - সুপার বিগ ও স্টাইলিশ */
        .name-wrapper {
            animation: bounce 2s infinite;
            pointer-events: auto;
        }

        .name-text {
            font-family: 'Bungee Shade', cursive;
            font-size: clamp(60px, 12vw, 150px);
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            margin: 0;
        }

        .apu-text {
            font-family: 'Pacifico', cursive;
            font-size: 50px;
            color: #00d4ff;
            margin-top: -30px;
            text-shadow: 0 0 15px #00d4ff;
        }

        .birthday-wish {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 2px dashed #ffd700;
            max-width: 500px;
            margin-top: 20px;
            pointer-events: auto;
            transform: rotate(-2deg);
        }

        .birthday-wish h2 {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .birthday-wish p {
            font-size: 18px;
            line-height: 1.6;
        }

        .btn-party {
            background: linear-gradient(45deg, #ff007f, #00d4ff);
            border: none;
            padding: 15px 40px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            border-radius: 50px;
            margin-top: 30px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.4);
            transition: 0.3s;
        }

        .btn-party:hover {
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 0 30px #ff007f;
        }
